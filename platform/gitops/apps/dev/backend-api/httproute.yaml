apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend-api
  namespace: apps
  labels:
    app.kubernetes.io/name: backend-api
    app.kubernetes.io/component: route
    app.kubernetes.io/part-of: terra
    terra/environment: dev
spec:
  hostnames:
    - frontend.dev.terra.local
  parentRefs:
    - name: public-http
      namespace: gateway-system
      sectionName: http
  rules:
    - matches:
        - path:
            type: Exact
            value: /api
      filters:
        - type: URLRewrite
          urlRewrite: 
            path: 
              type: ReplaceFullPath
              replaceFullPath: /
      backendRefs:
        - name: backend-api
          port: 80
    - matches: 
        - path:
            type: PathPrefix
            value: /api/
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replacePrefixMatch: /
      backendRefs:
        - name: backend-api
          port: 80